<svg xmlns="http://www.w3.org/2000/svg" viewBox="57.599999999999994 60 747.6 515" width="100%" height="100%">
  <defs>
    <style type="text/css">
      .adaptive-text { fill: #1e1e1e; font-family: "Inter", -apple-system, sans-serif; font-weight: 500; }
      .adaptive-stroke { stroke: #1e1e1e; fill: none; }
      .adaptive-marker { fill: #1e1e1e; }
      @media (prefers-color-scheme: dark) {
        .adaptive-text { fill: #ffffff; }
        .adaptive-stroke { stroke: #ffffff; }
        .adaptive-marker { fill: #ffffff; }
      }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" class="adaptive-marker" />
    </marker>
    <marker id="arrowhead-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1.5 L 1 5 L 10 8.5 z" class="adaptive-marker" />
    </marker>
  </defs>
  <rect x="210" y="100" width="180" height="75" rx="8" ry="8" fill="#ffc9c9" stroke-width="2" class="adaptive-stroke"  />
  <text x="300.0" font-size="16" text-anchor="middle" class="adaptive-text">
    <tspan x="300.0" y="127.5" dominant-baseline="central">Предметная</tspan>
    <tspan x="300.0" y="147.5" dominant-baseline="central">модель</tspan>
  </text>
  <text x="410" font-size="16" text-anchor="start" class="adaptive-text">
    <tspan x="410" y="137.5" dominant-baseline="central">Множество допустимых состояний</tspan>
  </text>
  <rect x="210" y="280" width="180" height="75" rx="8" ry="8" fill="#ffec99" stroke-width="2" class="adaptive-stroke"  />
  <text x="300.0" font-size="16" text-anchor="middle" class="adaptive-text">
    <tspan x="300.0" y="307.5" dominant-baseline="central">Административное</tspan>
    <tspan x="300.0" y="327.5" dominant-baseline="central">состояние</tspan>
  </text>
  <text x="410" font-size="16" text-anchor="start" class="adaptive-text">
    <tspan x="410" y="307.5" dominant-baseline="central">Желаемое состояние,</tspan>
    <tspan x="410" y="327.5" dominant-baseline="central">версионируемое в Git</tspan>
  </text>
  <rect x="210" y="460" width="180" height="75" rx="8" ry="8" fill="#b2f2bb" stroke-width="2" class="adaptive-stroke"  />
  <text x="300.0" font-size="16" text-anchor="middle" class="adaptive-text">
    <tspan x="300.0" y="487.5" dominant-baseline="central">Оперативное</tspan>
    <tspan x="300.0" y="507.5" dominant-baseline="central">состояние</tspan>
  </text>
  <text x="410" font-size="16" text-anchor="start" class="adaptive-text">
    <tspan x="410" y="487.5" dominant-baseline="central">Фактическое состояние</tspan>
    <tspan x="410" y="507.5" dominant-baseline="central">программного комплекса и оборудования</tspan>
  </text>
  <path d="M 300 272 L 300 183" stroke-width="2" class="adaptive-stroke"  marker-end="url(#arrowhead)" />
  <text x="225.0" font-size="14" text-anchor="end" class="adaptive-text">
    <tspan x="225.0" y="218.75" dominant-baseline="central">Принадлежность</tspan>
    <tspan x="225.0" y="236.25" dominant-baseline="central">множеству</tspan>
  </text>
  <path d="M 300 363 L 300 452" stroke-width="2" class="adaptive-stroke"  stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  <text x="225.0" font-size="14" text-anchor="end" class="adaptive-text">
    <tspan x="225.0" y="398.75" dominant-baseline="central">Синхронизация</tspan>
    <tspan x="225.0" y="416.25" dominant-baseline="central">платформой</tspan>
  </text>
</svg>